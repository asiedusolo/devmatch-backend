version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - '3000:3000'
    environment:
      - CHOKIDAR_USEPOLLING=true
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - NODE_ENV=development
    depends_on:
      - postgres
      - redis
  
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: devmatch
      POSTGRES_PASSWORD: password
      POSTGRES_DB: devmatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
  
  redis:
    image: redis:7
    restart: always
    ports:
      - '6379:6379'

volumes:
  pgdata: