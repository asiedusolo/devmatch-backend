version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: devmatch
      POSTGRES_PASSWORD: password
      POSTGRES_DB: devmatch
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - '6379:6379'
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - redis
volumes:
  pgdata: